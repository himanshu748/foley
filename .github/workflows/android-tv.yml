name: Android TV runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm ci
          npm test
          npm run build
      - name: Prepare isolated TLS origin
        run: |
          bash scripts/ci-tv-tls.sh
          node scripts/ci-tv-server.mjs > .ci/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --cacert .ci/server.crt https://localhost:4443/api/health; then break; fi
            sleep 1
          done
          curl --fail --cacert .ci/server.crt https://localhost:4443/api/health
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run installed APK on Android TV
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-tv-run.sh
      - name: Collect native evidence
        if: always()
        run: |
          mkdir -p .ci/evidence
          cp .ci/server.log .ci/evidence/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: foley-android-tv-evidence
          path: |
            .ci/evidence/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/apk/
          retention-days: 14

name: Judge APK
on:
  workflow_dispatch:
    inputs:
      origin:
        description: Stable public HTTPS origin for Foley (no path or credentials)
        required: true
        type: string
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOLEY_ORIGIN: ${{ inputs.origin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify public HTTPS origin
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request, json
          value = os.environ['FOLEY_ORIGIN']
          origin = urllib.parse.urlsplit(value)
          if origin.scheme != 'https' or not origin.hostname or origin.username or origin.password or origin.path not in ('', '/') or origin.query or origin.fragment or any(c.isspace() for c in value):
              raise SystemExit('Use an HTTPS origin without credentials, path, query or fragment')
          url = value.rstrip('/') + '/api/health'
          with urllib.request.urlopen(url, timeout=20) as response:
              if response.geturl() != url or json.load(response).get('ok') is not True:
                  raise SystemExit('Origin did not return Foley health directly')
          PY
      - name: Build installable judge APK
        working-directory: android
        run: |
          test ! -d app/src/debug
          ./gradlew --no-daemon assembleDebug "-PfoleyUrl=$FOLEY_ORIGIN"
      - name: Record source and origin
        run: |
          mkdir -p judge-build
          cp android/app/build/outputs/apk/debug/app-debug.apk judge-build/foley-tv.apk
          python3 - <<'PY'
          import json, os, pathlib, hashlib
          apk = pathlib.Path('judge-build/foley-tv.apk')
          pathlib.Path('judge-build/build.json').write_text(json.dumps({
              'source_commit': os.environ['GITHUB_SHA'],
              'origin': os.environ['FOLEY_ORIGIN'],
              'apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'signing': 'Android debug key; sideload only',
              'runtime_tested': False
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foley-judge-apk
          path: judge-build/
          retention-days: 90

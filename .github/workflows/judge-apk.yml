name: Judge APK
on:
  workflow_dispatch:
    inputs:
      origin:
        description: Stable public HTTPS origin for Foley (no path or credentials)
        required: true
        type: string
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOLEY_ORIGIN: ${{ inputs.origin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify public HTTPS origin
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request, json
          value = os.environ['FOLEY_ORIGIN']
          origin = urllib.parse.urlsplit(value)
          if origin.scheme != 'https' or not origin.hostname or origin.username or origin.password or origin.path not in ('', '/') or origin.query or origin.fragment or any(c.isspace() for c in value):
              raise SystemExit('Use an HTTPS origin without credentials, path, query or fragment')
          url = value.rstrip('/') + '/api/health'
          with urllib.request.urlopen(url, timeout=20) as response:
              if response.geturl() != url or json.load(response).get('ok') is not True:
                  raise SystemExit('Origin did not return Foley health directly')
          PY
      - name: Build installable judge APK
        working-directory: android
        run: |
          test ! -d app/src/debug
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest "-PfoleyUrl=$FOLEY_ORIGIN"
      - name: Record source and origin
        run: |
          mkdir -p judge-build
          cp android/app/build/outputs/apk/debug/app-debug.apk judge-build/foley-tv.apk
          python3 - <<'PY'
          import json, os, pathlib, hashlib
          apk = pathlib.Path('judge-build/foley-tv.apk')
          pathlib.Path('judge-build/build.json').write_text(json.dumps({
              'source_commit': os.environ['GITHUB_SHA'],
              'origin': os.environ['FOLEY_ORIGIN'],
              'apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'signing': 'Android debug key; sideload only',
              'runtime_tested': False
          }, indent=2) + '\n')
          PY
      - name: Prepare emulator audio output capture
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 update -qq
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 install --no-install-recommends -y ffmpeg pulseaudio pulseaudio-utils xvfb x11-utils libxcb-cursor0 libxkbcommon-x11-0
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=foley_tv rate=48000 channels=2
          pactl set-default-sink foley_tv
          pactl set-sink-mute foley_tv 0
          pactl set-sink-volume foley_tv 100%
          # Use an explicit loopback endpoint across the emulator's bundled
          # libpulse and the runner client, independent of runtime-directory lookup.
          pactl load-module module-native-protocol-tcp listen=127.0.0.1 port=4713 auth-ip-acl=127.0.0.1
          foley_pulse_server=tcp:127.0.0.1:4713
          pactl --server="$foley_pulse_server" info
          echo "PULSE_SERVER=$foley_pulse_server" >> "$GITHUB_ENV"
          echo "QEMU_PA_SERVER=$foley_pulse_server" >> "$GITHUB_ENV"
          echo "QEMU_PA_SINK=foley_tv" >> "$GITHUB_ENV"
          # -no-window selects a separate binary with stubbed PulseAudio calls.
          # Use the normal engine on a virtual X display for real output capture.
          nohup Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > /tmp/foley-xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 1
          done
          DISPLAY=:99 xdpyinfo >/dev/null
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the exported APK against public HTTPS on Android TV
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          QEMU_AUDIO_DRV: pa
          PULSE_SINK: foley_tv
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -audio pa -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash scripts/ci-judge-tv-run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: foley-judge-apk
          path: judge-build/
          retention-days: 90
